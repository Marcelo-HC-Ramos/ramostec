<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Ramostec</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap');
  :root { --navy:#1A3A5C; --orange:#F07B24; --orange-dark:#D4661A; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Barlow',sans-serif;background:#0A1525;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .bg-pattern{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 40%,rgba(240,123,36,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(26,58,92,0.4) 0%,transparent 50%);pointer-events:none;}
  .login-box{background:#0F1C2E;border:1px solid #1E3050;border-radius:20px;padding:3rem 2.5rem;width:100%;max-width:420px;position:relative;z-index:1;box-shadow:0 24px 64px rgba(0,0,0,0.5);}
  .login-logo{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;color:white;text-align:center;margin-bottom:0.3rem;}
  .login-logo span{color:var(--orange);}
  .login-subtitle{text-align:center;font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#4B6278;margin-bottom:2.5rem;}
  .form-group{margin-bottom:1.2rem;}
  .form-label{display:block;font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:#8BA0B4;margin-bottom:0.5rem;}
  .form-input{width:100%;padding:0.85rem 1rem;border:1.5px solid #1E3050;border-radius:10px;background:#0A1525;color:white;font-family:inherit;font-size:0.95rem;outline:none;transition:border-color 0.2s;}
  .form-input:focus{border-color:var(--orange);}
  .form-input::placeholder{color:#3A5068;}
  .btn-login{width:100%;padding:1rem;background:var(--orange);color:white;border:none;border-radius:10px;font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;transition:all 0.2s;margin-top:0.5rem;}
  .btn-login:hover{background:var(--orange-dark);transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,123,36,0.4);}
  .error-msg{background:rgba(220,38,38,0.12);border:1px solid rgba(220,38,38,0.3);color:#FCA5A5;border-radius:8px;padding:0.8rem 1rem;font-size:0.85rem;margin-top:1rem;display:none;text-align:center;}
  .error-msg.show{display:block;}
  .back-link{display:block;text-align:center;margin-top:1.5rem;color:#4B6278;font-size:0.85rem;text-decoration:none;transition:color 0.2s;}
  .back-link:hover{color:#8BA0B4;}
  .lock-icon{text-align:center;font-size:2.5rem;margin-bottom:1.5rem;}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="login-box">
  <div class="lock-icon">🔐</div>
  <div class="login-logo">RAMOS<span>TEC</span></div>
  <div class="login-subtitle">Painel Administrativo</div>
  <div class="form-group">
    <label class="form-label">Usuário</label>
    <input type="text" id="username" class="form-input" placeholder="Digite seu usuário" autocomplete="username">
  </div>
  <div class="form-group">
    <label class="form-label">Senha</label>
    <input type="password" id="password" class="form-input" placeholder="Digite sua senha" autocomplete="current-password">
  </div>
  <button class="btn-login" onclick="doLogin()">Entrar no Painel</button>
  <div class="error-msg" id="errorMsg">❌ Usuário ou senha incorretos.</div>
  <a href="index.html" class="back-link">← Voltar ao site</a>
</div>
<script>
  // Credenciais padrão — altere aqui para personalizar
  const ADMIN_USER = 'ramostec';
  const ADMIN_PASS = 'admin123';

  document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

  function doLogin() {
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if(u === ADMIN_USER && p === ADMIN_PASS) {
      sessionStorage.setItem('ramostec_admin', 'true');
      sessionStorage.setItem('ramostec_admin_user', u);
      window.location.href = 'admin.html';
    } else {
      const err = document.getElementById('errorMsg');
      err.classList.add('show');
      setTimeout(()=>err.classList.remove('show'), 3000);
    }
  }

  // Se já logado, redireciona direto
  if(sessionStorage.getItem('ramostec_admin')==='true') window.location.href='admin.html';
</script>
</body>
</html>
